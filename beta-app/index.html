<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beta App - Port 8080</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            padding: 20px;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .badge {
            display: inline-block;
            background: #3b82f6;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 9999px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 12px;
            color: #ffffff;
        }
        p {
            color: #94a3b8;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .meta-box {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 8px;
            padding: 16px;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        .meta-item {
            margin-bottom: 6px;
        }
        .meta-item:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">Port 8080</span>
        <h1>Beta App</h1>
        <p>Môi trường thử nghiệm ứng dụng (Testing & Staging Environment).</p>
        <div class="meta-box">
            <div class="meta-item"><strong>Service:</strong> Beta Application</div>
            <div class="meta-item"><strong>Port:</strong> 8080</div>
            <div class="meta-item"><strong>Root:</strong> /var/www/beta-app/html</div>
            <div class="meta-item"><strong>Status:</strong> Active / Healthy</div>
        </div>
    </div>
</body>
</html>
