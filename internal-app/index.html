<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal App - Port 8090</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #064e3b 0%, #022c22 100%);
            color: #f8fafc;
            padding: 20px;
        }
        .card {
            background: rgba(6, 78, 59, 0.5);
            border: 1px solid rgba(52, 211, 153, 0.2);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .badge {
            display: inline-block;
            background: #10b981;
            color: #064e3b;
            font-size: 14px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 9999px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 12px;
            color: #ffffff;
        }
        p {
            color: #a7f3d0;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .meta-box {
            background: rgba(2, 44, 34, 0.7);
            border-radius: 8px;
            padding: 16px;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            color: #6ee7b7;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .meta-item {
            margin-bottom: 6px;
        }
        .meta-item:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">Port 8090</span>
        <h1>Internal App</h1>
        <p>Hệ thống thông tin và quản trị nội bộ (Internal Dashboard).</p>
        <div class="meta-box">
            <div class="meta-item"><strong>Service:</strong> Internal Information Portal</div>
            <div class="meta-item"><strong>Port:</strong> 8090</div>
            <div class="meta-item"><strong>Root:</strong> /var/www/internal-app/html</div>
            <div class="meta-item"><strong>Status:</strong> Active / Restricted Access</div>
        </div>
    </div>
</body>
</html>
